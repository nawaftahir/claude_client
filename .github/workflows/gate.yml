name: client-gate
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cod2-client-ci:1
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: target/build/obj
          key: obj-${{ github.sha }}
          restore-keys: obj-
      - name: Build
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull -q "$IMAGE"
          pip install -q pefile capstone
          # private image holds the compiler, d3d9.lib, dsound.lib and the retail anchor (never in git)
          mkdir -p target/build/lib
          docker run --rm -v "$PWD/target:/w" -w /w "$IMAGE" sh -c \
            'cp /opt/ci/anchor/CoD2MP_s.exe build/anchor.exe && cp /opt/ci/lib/d3d9.lib build/lib/ && cp /opt/ci/lib/dsound.lib . && chmod -R a+rw build'
          # icon comes from the retail exe (host step, as in the Makefile)
          (cd target && python3 ../rsrc.py build/anchor.exe build/cod2mp.ico)
          docker run --rm -v "$PWD/target:/w" -w /w "$IMAGE" sh -c \
            'make -j$(nproc) -k IN_IMAGE=1 build/CoD2MP_s.exe; s=$?; chmod -R a+rw build; exit $s'
          if grep -m5 "LNK2001\|LNK2019" target/build/link.log; then echo "unresolved externals"; exit 1; fi
      - name: Referee + ratchet
        run: |
          cd target
          python3 ../cmp.py build/CoD2MP_s.exe build/CoD2MP_s.map build/anchor.exe build/exp.json > /dev/null
          rm -f build/anchor.exe
          python3 ../cov.py build/exp.json | grep 'unique bytes' | tee -a "$GITHUB_STEP_SUMMARY"
          python3 ../ci/ratchet.py ../ci/good.json build/exp.json ../ci/ties.txt | tail -20 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build
          path: |
            target/build/CoD2MP_s.exe
            target/build/CoD2MP_s.map
            target/build/exp.json
            target/build/link.log
