name: client-batch
# Build every ci/batch/*.patch on the dispatched branch in parallel; each job reports NET + ratchet vs ci/good.json.
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cod2-client-ci:1
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      patches: ${{ steps.ls.outputs.patches }}
    steps:
      - uses: actions/checkout@v4
      - id: ls
        run: echo "patches=$(ls ci/batch/*.patch | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
  build:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        patch: ${{ fromJson(needs.list.outputs.patches) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: target/build/obj
          key: obj-${{ github.sha }}
          restore-keys: obj-
      - name: Apply
        run: git apply "${{ matrix.patch }}"
      - name: Build
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull -q "$IMAGE"
          pip install -q pefile capstone
          mkdir -p target/build/lib
          docker run --rm -v "$PWD/target:/w" -w /w "$IMAGE" sh -c \
            'cp /opt/ci/anchor/CoD2MP_s.exe build/anchor.exe && cp /opt/ci/lib/d3d9.lib build/lib/ && cp /opt/ci/lib/dsound.lib . && chmod -R a+rw build'
          (cd target && python3 ../rsrc.py build/anchor.exe build/cod2mp.ico)
          docker run --rm -v "$PWD/target:/w" -w /w "$IMAGE" sh -c \
            'make -j$(nproc) -k IN_IMAGE=1 build/CoD2MP_s.exe; s=$?; chmod -R a+rw build; exit $s'
          if grep -m5 "LNK2001\|LNK2019" target/build/link.log; then echo "unresolved externals"; exit 1; fi
      - name: Referee
        run: |
          cd target
          python3 ../cmp.py build/CoD2MP_s.exe build/CoD2MP_s.map build/anchor.exe build/exp.json > /dev/null
          rm -f build/anchor.exe
          name=$(basename "${{ matrix.patch }}" .patch)
          { echo "### $name"; python3 ../cov.py build/exp.json | grep -o 'unique bytes [0-9]*'
            python3 ../ci/ratchet.py ../ci/good.json build/exp.json ../ci/ties.txt | grep -v '\$L' | tail -15; } | tee result.txt >> "$GITHUB_STEP_SUMMARY"
          mkdir -p ../out && cp result.txt ../out/$name.txt && cp build/exp.json ../out/$name.json
          cp build/CoD2MP_s.exe ../out/$name.exe && cp build/CoD2MP_s.map ../out/$name.map
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: res-${{ strategy.job-index }}
          path: out/
